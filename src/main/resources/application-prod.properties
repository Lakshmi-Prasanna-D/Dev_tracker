# ==============================================================================
# DevTrack - Production Configuration Profile
# ==============================================================================
server.port=${PORT:8085}

# MySQL Database Configuration (overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Caching Enabled in Production
spring.thymeleaf.cache=true

# Logging
logging.level.root=INFO
logging.level.com.devtrack.devtrack=INFO
logging.level.org.springframework.security=WARN
