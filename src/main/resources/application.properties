# Application Configuration
spring.application.name=DevTrack
server.port=${PORT:8085}

# MySQL Database Configuration
# Uses port 3307 by default (or standard 3306 if SPRING_DATASOURCE_URL environment variable is provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/devtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate ORM Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.com.devtrack.devtrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
