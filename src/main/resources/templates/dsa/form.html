<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('DSA Problem')}"></head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('dsa')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <nav th:replace="~{layout/fragments :: navbar('DSA Problem')}"></nav>

        <!-- Body Content -->
        <main class="content-body">
            <!-- Flash Alerts -->
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit DSA Problem' : 'Log New DSA Problem'}">DSA Problem</h3>
                            <p class="text-muted mb-0">Record solution notes, platform links, and algorithms used.</p>
                        </div>
                        <a href="/dsa" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to DSA</a>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="${isEdit ? '/dsa/edit/' + problem.id : '/dsa'}" th:object="${problem}" method="post">

                                <!-- Title -->
                                <div class="mb-3">
                                    <label for="title" class="form-label fw-semibold">Problem Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" th:field="*{title}" class="form-control"
                                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                           placeholder="e.g., Trapping Rain Water, Course Schedule">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title is required</div>
                                </div>

                                <!-- Platform & Problem URL -->
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-5">
                                        <label for="platform" class="form-label fw-semibold">Platform <span class="text-danger">*</span></label>
                                        <select id="platform" th:field="*{platform}" class="form-select"
                                                th:classappend="${#fields.hasErrors('platform')} ? 'is-invalid' : ''">
                                            <option th:each="p : ${platforms}" th:value="${p}" th:text="${p.displayName}"></option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-7">
                                        <label for="problemUrl" class="form-label fw-semibold">Problem URL</label>
                                        <input type="url" id="problemUrl" th:field="*{problemUrl}" class="form-control"
                                               placeholder="https://leetcode.com/problems/...">
                                    </div>
                                </div>

                                <!-- Topic, Difficulty, Status -->
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-4">
                                        <label for="topic" class="form-label fw-semibold">Topic <span class="text-danger">*</span></label>
                                        <select id="topic" th:field="*{topic}" class="form-select"
                                                th:classappend="${#fields.hasErrors('topic')} ? 'is-invalid' : ''">
                                            <option th:each="t : ${topics}" th:value="${t}" th:text="${t.displayName}"></option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label for="difficulty" class="form-label fw-semibold">Difficulty <span class="text-danger">*</span></label>
                                        <select id="difficulty" th:field="*{difficulty}" class="form-select">
                                            <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d.displayName}"></option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label for="status" class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                                        <select id="status" th:field="*{status}" class="form-select">
                                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Notes & Key Takeaways -->
                                <div class="mb-4">
                                    <label for="notes" class="form-label fw-semibold">Solution Approach &amp; Notes</label>
                                    <textarea id="notes" th:field="*{notes}" class="form-control" rows="4"
                                              placeholder="Note time/space complexity (e.g. O(n) time, O(1) space), edge cases, and key algorithm patterns used..."></textarea>
                                </div>

                                <!-- Submit Buttons -->
                                <div class="d-flex justify-content-end gap-2">
                                    <a href="/dsa" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-success px-4" th:text="${isEdit ? 'Save Changes' : 'Log Problem'}">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>

    <!-- Scripts -->
    <div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
