<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Calendar')}"></head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('calendar')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <nav th:replace="~{layout/fragments :: navbar('Developer Schedule & Calendar')}"></nav>

        <!-- Body Content -->
        <main class="content-body">
            <!-- Flash Alerts -->
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <!-- Header & Navigation -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Developer Schedule &amp; Calendar</h3>
                    <p class="text-muted mb-0">Unified view of learning targets, project deliverables, reminders, and daily achievements.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{'/calendar?year=' + ${prevYear} + '&month=' + ${prevMonth}}" class="btn btn-outline-secondary btn-sm" title="Previous Month">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <h5 class="fw-bold mb-0 px-2 text-center" style="min-width: 170px;" th:text="${monthName} + ' ' + ${currentYear}">Month 2026</h5>
                    <a th:href="@{'/calendar?year=' + ${nextYear} + '&month=' + ${nextMonth}}" class="btn btn-outline-secondary btn-sm" title="Next Month">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                    <a href="/calendar" class="btn btn-sm btn-outline-primary ms-2">Today</a>
                </div>
            </div>

            <!-- Calendar Legend -->
            <div class="card mb-3 py-2 px-3">
                <div class="d-flex flex-wrap align-items-center gap-3 small">
                    <span class="fw-semibold text-muted">Legend:</span>
                    <span><span class="badge bg-primary me-1">&bull;</span>Goal Deadline</span>
                    <span><span class="badge bg-info me-1">&bull;</span>Project Deadline</span>
                    <span><span class="badge bg-warning text-dark me-1">&bull;</span>Milestone</span>
                    <span><span class="badge bg-danger me-1">&bull;</span>Reminder</span>
                    <span><span class="badge bg-secondary me-1">&bull;</span>Activity Completed</span>
                </div>
            </div>

            <!-- Calendar Card Grid -->
            <div class="card">
                <div class="card-body p-3">
                    <!-- Day of Week Header -->
                    <div class="calendar-grid mb-2">
                        <div class="calendar-header-day">Mon</div>
                        <div class="calendar-header-day">Tue</div>
                        <div class="calendar-header-day">Wed</div>
                        <div class="calendar-header-day">Thu</div>
                        <div class="calendar-header-day">Fri</div>
                        <div class="calendar-header-day">Sat</div>
                        <div class="calendar-header-day text-danger">Sun</div>
                    </div>

                    <!-- Calendar Days Grid -->
                    <div class="calendar-grid">
                        <!-- Blank padding cells for days before the 1st of the month (1 = Mon, 7 = Sun) -->
                        <div th:each="pad : ${#numbers.sequence(1, startDayOfWeek - 1)}"
                             th:if="${startDayOfWeek > 1}"
                             class="calendar-day-cell other-month">
                        </div>

                        <!-- Days of the current month -->
                        <div th:each="day : ${#numbers.sequence(1, daysInMonth)}"
                             class="calendar-day-cell"
                             th:classappend="${currentYear == todayYear and currentMonth == todayMonth and day == todayDay} ? 'today' : ''">

                            <!-- Day number -->
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="calendar-day-num"
                                      th:classappend="${currentYear == todayYear and currentMonth == todayMonth and day == todayDay} ? 'text-primary fw-bold' : ''"
                                      th:text="${day}">1</span>
                                <span th:if="${currentYear == todayYear and currentMonth == todayMonth and day == todayDay}"
                                      class="badge bg-primary" style="font-size: 0.65rem;">Today</span>
                            </div>

                            <!-- Events on this day -->
                            <div class="overflow-auto flex-grow-1" style="max-height: 85px;">
                                <div th:if="${eventsByDay.containsKey(day)}">
                                    <a th:each="ev : ${eventsByDay.get(day)}"
                                       th:href="${ev.url}"
                                       class="calendar-event-pill"
                                       th:classappend="'bg-' + ${ev.badgeClass} + (${ev.badgeClass == 'warning'} ? ' text-dark' : ' text-white')"
                                       th:title="${ev.title + (ev.description != null ? ' - ' + ev.description : '')}">
                                        <i th:if="${ev.completed}" class="bi bi-check2"></i>
                                        <span th:text="${ev.title}">Event</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>

    <!-- Scripts -->
    <div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
