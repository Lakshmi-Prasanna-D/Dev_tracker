<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DevTrack Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                        #0b0f19;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }
        .auth-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .auth-header {
            padding: 2.25rem 2.25rem 1.25rem;
            text-align: center;
        }
        .auth-body {
            padding: 1.25rem 2.25rem 2.25rem;
        }
        .brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            margin-bottom: 1rem;
        }
        .form-control {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
        }
        .form-control:focus {
            background-color: #1e293b;
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .input-group-text {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 0.6rem;
        }
        .btn-auth-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.6rem;
            transition: all 0.2s;
        }
        .btn-auth-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .demo-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.78rem;
        }
        .demo-chip:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-icon">
            <i class="bi bi-cpu"></i>
        </div>
        <h3 class="fw-bold mb-1 text-white">DevTrack</h3>
        <p class="text-secondary small mb-0">Developer Growth &amp; Productivity Platform</p>
    </div>

    <div class="auth-body">
        <!-- Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Invalid username or password.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Operation successful.</span>
        </div>
        <div th:if="${infoMessage}" class="alert alert-info py-2 px-3 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="${infoMessage}">Signed out.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" id="usernameInput" class="form-control" placeholder="e.g. alex" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label small text-secondary fw-semibold">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary input-group-text" type="button" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input bg-dark border-secondary" type="checkbox" name="remember-me" id="rememberMe" checked>
                    <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
                </div>
                <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 small px-2 py-1">v1.0 Ready</span>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to DevTrack
            </button>
        </form>

        <!-- Quick Demo Account Switcher -->
        <div class="pt-3 border-top border-secondary border-opacity-25">
            <div class="small text-secondary mb-2 fw-semibold">Demo Accounts (click to fill):</div>
            <div class="d-flex gap-2">
                <div class="demo-chip flex-fill text-center" onclick="fillDemo('alex', 'password123')">
                    <strong class="text-white">alex</strong>
                    <div class="text-muted" style="font-size: 0.7rem;">(Full Data / Streaks)</div>
                </div>
                <div class="demo-chip flex-fill text-center" onclick="fillDemo('sarah', 'password123')">
                    <strong class="text-white">sarah</strong>
                    <div class="text-muted" style="font-size: 0.7rem;">(Clean Slate / Starter)</div>
                </div>
            </div>
        </div>

        <!-- Register Link -->
        <div class="text-center mt-4">
            <span class="text-secondary small">Don't have an account?</span>
            <a href="/register" class="small text-primary text-decoration-none fw-semibold ms-1">Create one now &rarr;</a>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}

function fillDemo(username, password) {
    document.getElementById('usernameInput').value = username;
    document.getElementById('passwordInput').value = password;
}
</script>

</body>
</html>
