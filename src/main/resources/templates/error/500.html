<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('500 Server Error')}"></head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('dashboard')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <nav th:replace="~{layout/fragments :: navbar('500 Server Error')}"></nav>

        <!-- Body Content -->
        <main class="content-body">
            <div class="row justify-content-center py-5">
                <div class="col-12 col-md-8 col-lg-6 text-center">
                    <div class="display-1 fw-bold text-danger mb-2">500</div>
                    <h3 class="fw-bold mb-3" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Server Error</h3>
                    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected internal error occurred while processing your request. Please check the logs.'}">
                        An unexpected condition was encountered on the server.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="/dashboard" class="btn btn-primary"><i class="bi bi-speedometer2 me-1"></i>Back to Safety</a>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>

    <!-- Scripts -->
    <div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
