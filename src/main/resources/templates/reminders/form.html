<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Reminder')}"></head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('reminders')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <nav th:replace="~{layout/fragments :: navbar('Reminder')}"></nav>

        <!-- Body Content -->
        <main class="content-body">
            <!-- Flash Alerts -->
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Reminder' : 'Schedule New Reminder'}">Reminder</h3>
                            <p class="text-muted mb-0">Set timely notifications for deadlines, practice sessions, or reviews.</p>
                        </div>
                        <a href="/reminders" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Reminders</a>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="${isEdit ? '/reminders/edit/' + reminder.id : '/reminders'}" th:object="${reminder}" method="post">

                                <!-- Title -->
                                <div class="mb-3">
                                    <label for="title" class="form-label fw-semibold">Reminder Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" th:field="*{title}" class="form-control"
                                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                           placeholder="e.g., LeetCode Weekly Contest Review">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title is required</div>
                                </div>

                                <!-- Due Date and Time -->
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <label for="dueDateTime" class="form-label fw-semibold">Due Date &amp; Time <span class="text-danger">*</span></label>
                                        <input type="datetime-local" id="dueDateTime" th:field="*{dueDateTime}" class="form-control"
                                               th:classappend="${#fields.hasErrors('dueDateTime')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDateTime')}" th:errors="*{dueDateTime}">Due date is required</div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="status" class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                                        <select id="status" th:field="*{status}" class="form-select">
                                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Related Goal or Project -->
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <label for="goal" class="form-label fw-semibold">Link to Learning Goal (Optional)</label>
                                        <select id="goal" th:field="*{goal}" class="form-select">
                                            <option value="">None (Independent)</option>
                                            <option th:each="g : ${goals}" th:value="${g.id}" th:text="${g.title}"></option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="project" class="form-label fw-semibold">Link to Project (Optional)</label>
                                        <select id="project" th:field="*{project}" class="form-select">
                                            <option value="">None (Independent)</option>
                                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.projectName}"></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Message -->
                                <div class="mb-4">
                                    <label for="message" class="form-label fw-semibold">Notes / Message</label>
                                    <textarea id="message" th:field="*{message}" class="form-control" rows="3"
                                              placeholder="Specific reminders, links, or instructions to prepare..."></textarea>
                                </div>

                                <!-- Submit Buttons -->
                                <div class="d-flex justify-content-end gap-2">
                                    <a href="/reminders" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-warning px-4 text-dark fw-medium" th:text="${isEdit ? 'Save Changes' : 'Schedule Reminder'}">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>

    <!-- Scripts -->
    <div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
